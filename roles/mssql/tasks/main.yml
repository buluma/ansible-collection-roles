---
- name: Import assert.yml
  ansible.builtin.import_tasks: assert.yml
  delegate_to: localhost
  run_once: true
- name: Add yum repository packages-microsoft-com-mssql-server
  ansible.builtin.yum_repository:
    baseurl: "{{ item.baseurl }}"
    description: "{{ item.description }}"
    gpgcheck: true
    gpgkey: "{{ mssql_gpgkey }}"
    name: "{{ item.name }}"
    state: present
  loop: "{{ mssql_rhel_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - ansible_facts['distribution'] in [ "AlmaLinux", "CentOS", "Fedora", "RedHat", "Rocky", "Amazon" ]
    - mssql_add_repositories
- name: Install required package python3-debian
  ansible.builtin.package:
    name: python3-debian
  when:
    - ansible_facts['os_family'] == "Debian"
    - mssql_add_repositories
# The one-line sources below were written by earlier versions of this role.
# Remove them so upgrades don't leave duplicate sources. The key file in
# /etc/apt/trusted.gpg.d is written by buluma.microsoft_repository_keys, so it is kept.
- name: Remove legacy apt source
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ _mssql_apt_repository_uri | regex_replace('[^A-Za-z0-9]+', '_') | trim('_') }}.list"
    state: absent
  vars:
    _mssql_apt_repository_uri: "{{ item.repo | regex_replace('^\\w+://', '') | regex_replace('^[^/]*@', '') }}"
  loop: "{{ mssql_ubuntu_repositories }}"
  loop_control:
    label: "{{ item.repo }}"
  when:
    - ansible_facts['os_family'] == "Debian"
    - mssql_add_repositories
- name: Add apt repository
  ansible.builtin.deb822_repository:
    # Both repositories share host and suite, so the URI path is part of the name.
    name: "{{ (_mssql_apt_repository_uri ~ '_' ~ ansible_facts['distribution_release']) | regex_replace('[^A-Za-z0-9_-]+', '_') | trim('_') }}"
    types: deb
    uris: "{{ item.repo }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures:
      - amd64
      - arm64
      - armhf
    signed_by: "{{ mssql_gpgkey }}"
    state: present
  vars:
    _mssql_apt_repository_uri: "{{ item.repo | regex_replace('^\\w+://', '') | regex_replace('^[^/]*@', '') }}"
  register: mssql_deb822_repository
  loop: "{{ mssql_ubuntu_repositories }}"
  loop_control:
    label: "{{ item.repo }}"
  when:
    - ansible_facts['os_family'] == "Debian"
    - mssql_add_repositories
# deb822_repository does not refresh the package cache, apt_repository did.
- name: Update apt cache  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts['os_family'] == "Debian"
    - mssql_add_repositories
    - mssql_deb822_repository is changed
- name: Install software mssql-server (package)
  ansible.builtin.package:
    name: "{{ mssql_server_package }}"
    state: present
  environment:
    ACCEPT_EULA: "Y"
  notify:
    - Stop mssql-server
    - Configure mssql-server using mssql-conf
    - Set network.ipaddress
  when:
    - ansible_facts['distribution'] != "Ubuntu"
- name: Install software in mssql-server (apt)
  ansible.builtin.apt:
    allow_unauthenticated: true
    name: "{{ mssql_server_package }}"
    state: present
  environment:
    ACCEPT_EULA: "Y"
  notify:
    - Configure mssql-server using mssql-conf
  when:
    - ansible_facts['distribution'] == "Ubuntu"
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
- name: Install software mssql-tools (package)
  ansible.builtin.package:
    name: mssql-tools
    state: present
  environment:
    ACCEPT_EULA: "Y"
  when:
    - ansible_facts['distribution'] != "Ubuntu"
- name: Install software in mssql-tools (apt)
  ansible.builtin.apt:
    allow_unauthenticated: true
    name: mssql-tools
    state: present
  environment:
    ACCEPT_EULA: "Y"
  when:
    - ansible_facts['distribution'] == "Ubuntu"
- name: Install software mssql-server-agent (package)
  ansible.builtin.package:
    name: "{{ mssql_server_agent_package }}"
    state: present
  environment:
    ACCEPT_EULA: "Y"
  notify:
    - Restart mssql-server
  when:
    - ansible_facts['distribution'] != "Ubuntu" and mssql_version == 2017
- name: Install software in mssql-server-agent (apt)
  ansible.builtin.apt:
    allow_unauthenticated: true
    name: "{{ mssql_server_agent_package }}"
    state: present
  environment:
    ACCEPT_EULA: "Y"
  notify:
    - Restart mssql-server
  when:
    - ansible_facts['distribution'] == "Ubuntu" and mssql_version == 2017
- name: Install mssql-server-fts
  ansible.builtin.package:
    name: "{{ mssql_fts_package }}"
  notify:
    - Restart mssql-server
  when:
    - mssql_fts
- name: Flush handlers again
  ansible.builtin.meta: flush_handlers
- name: Start and enable mssql-server
  ansible.builtin.service:
    enabled: true
    name: mssql-server
    state: started
  environment:
    ACCEPT_EULA: "Y"
