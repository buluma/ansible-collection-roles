---
- name: install | Ensure dependencies are installed.
  ansible.builtin.package:
    name:
      - lsof
      - acl
      - sudo
      # bin/solr's status/stop logic shells out to `ps -p`, which isn't
      # present on some minimal images (procps-ng/procps isn't pulled in
      # by anything else in the base install).
      - "{{ 'procps-ng' if ansible_facts['os_family'] == 'RedHat' else 'procps' }}"
    state: present

- name: install | Ensure service wrapper is installed for RHEL 9+.
  ansible.builtin.package:
    name:
      - initscripts-service
      - chkconfig
    state: present
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_version'].split(".")[0] >= '9'
    - solr_version is version('10', '<')

- name: install | Ensure service wrapper is installed for RHEL 7 & 8.
  ansible.builtin.package:
    name:
      - initscripts
      - chkconfig
    state: present
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_version'].split(".")[0] <= '8'
    - solr_version is version('10', '<')

- name: install | Ensure service wrapper is installed for Debian-based distributions.
  ansible.builtin.package:
    name: init-system-helpers
    state: present
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - ansible_facts['os_family'] == 'Debian'
    - solr_version is version('10', '<')

# We add '-n' to Solr versions beyond 6.3.0 to prevent autostart on install.
- name: install | Run Solr installation script.
  ansible.builtin.command:
    cmd: >-
      {{ solr_workspace }}/{{ solr_filename }}/bin/install_solr_service.sh
      {{ solr_workspace }}/{{ solr_filename }}.tgz
      -i {{ solr_install_dir }}
      -d {{ solr_home }}
      -u {{ solr_user }}
      -s {{ solr_service_name }}
      -p {{ solr_port }}
      {{ (solr_version is version('6.3.0', '>=')) | ternary('-n', '') }}
      {{ (solr_version is version('5.4.0', '>=')) | ternary('-f', '') }}
    creates: "{{ solr_install_path }}/bin/solr"
  register: solr_install_script_result

# Workaround for bug https://github.com/ansible/ansible-modules-core/issues/915.
- name: install | Ensure solr is stopped (RHEL 7+ workaround).
  ansible.builtin.command: service {{ solr_service_name }} stop
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_version'].split(".")[0] >= '7'
    - solr_install_script_result.changed
    - solr_version is version('10', '<')
  failed_when: false
  tags: ["skip_ansible_lint"]

- name: install | Run systemd daemon_reload (RHEL 7+ workaround).
  ansible.builtin.systemd:
    name: solr
    daemon_reload: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_version'].split(".")[0] >= '7'
    - solr_install_script_result.changed
    - solr_version is version('10', '<')
  tags: ["skip_ansible_lint"]

# Solr 10 installs a systemd unit instead of an init.d script, but its
# `bin/solr start` defaults to SolrCloud. This role manages standalone
# (user-managed) Solr, and the mode can't be set in solr.in.sh, so the
# unit's start command is overridden with a drop-in.
- name: install | Create the systemd drop-in directory.
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ solr_service_name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - solr_version is version('10', '>=')

- name: install | Start Solr in user-managed mode.
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart={{ solr_install_path }}/bin/solr start --user-managed
    dest: "/etc/systemd/system/{{ solr_service_name }}.service.d/user-managed.conf"
    owner: root
    group: root
    mode: "0644"
  register: solr_user_managed_dropin
  notify: Restart solr
  when:
    - solr_version is version('10', '>=')

- name: install | Reload systemd for the Solr drop-in.  # noqa: no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - solr_version is version('10', '>=')
    - solr_user_managed_dropin is changed
