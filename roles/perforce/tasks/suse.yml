---
- name: suse | Install required package gpg2
  vars:
    ansible_python_interpreter: "python3"
  community.general.zypper:
    name: gpg2
    state: present

# A key is checked against its listed fingerprint before it is imported, see
# rpm-key.yml. Removing a key needs no download.
- name: suse | Verify and import rpm keys
  vars:
    ansible_python_interpreter: "python3"
  ansible.builtin.include_tasks: rpm-key.yml
  loop: "{{ _rpm_key | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    loop_var: _perforce_rpm_key
    label: "{{ _perforce_rpm_key.key }}"

- name: suse | Rpm --import absent
  vars:
    ansible_python_interpreter: "python3"
  ansible.builtin.rpm_key:
    key: "{{ item.key }}"
    fingerprint: "{{ item.fingerprint }}"
    state: "{{ item.state }}"
  loop: "{{ _rpm_key | rejectattr('state', 'equalto', 'present') | list }}"
  register: result
  until: result is succeeded

- name: suse | Yum-config-manager --add-repo
  ansible.builtin.yum_repository:
    file: "{{ item.file }}"
    name: "{{ item.name }}"
    description: "{{ item.description }}"
    baseurl: "{{ item.baseurl }}"
    enabled: "{{ item.enabled }}"
    priority: "{{ item.priority }}"
    module_hotfixes: "{{ item.module_hotfixes }}"
    gpgcheck: "{{ item.gpgcheck }}"
    gpgkey: "{{ item.gpgkey }}"
    state: "{{ item.state }}"
    reposdir: "{{ item.reposdir | default('/etc/zypp/repos.d') }}"
  loop: "{{ _yum_repository }}"

- name: suse | Zypper install
  vars:
    ansible_python_interpreter: "python3"
  community.general.zypper:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    force_resolution: true
  loop: "{{ _zypper }}"
  register: result
  until: result is succeeded
