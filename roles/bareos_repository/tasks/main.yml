---
# tasks file for bareos_repository

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Add repository (rpm)
  ansible.builtin.yum_repository:
    name: "{{ item.name }}"
    description: "{{ item.description }}"
    baseurl: "{{ item.baseurl }}"
    gpgcheck: true
    gpgkey: "{{ item.gpgkey }}"
    username: "{{ item.username | default(omit) }}"
    password: "{{ item.password | default(omit) }}"
  no_log: true
  loop: "{{ bareos_repository_list }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - ansible_facts['pkg_mgr'] in [ "dnf", "dnf5", "yum" ]

- name: Run tasks on apt based distributions
  when:
    - ansible_facts['pkg_mgr'] in [ "apt" ]
  block:
    - name: Install CA certificates (apt)
      ansible.builtin.package:
        name: ca-certificates

    - name: Download gpg key (apt)
      ansible.builtin.get_url:
        url: "{{ bareos_repository_gpg_key }}"
        dest: /etc/apt/bareos.gpg
        username: "{{ bareos_repository_username }}"
        password: "{{ bareos_repository_password }}"
        owner: root
        group: root
        mode: "0644"
      no_log: true

    - name: Place credentials file (apt)
      ansible.builtin.copy:
        content: |
          machine download.bareos.com
          login {{ bareos_repository_username }}
          password {{ bareos_repository_password }}
        dest: /etc/apt/auth.conf.d/download_bareos_com.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when:
        - bareos_repository_type == "subscription"

    - name: Install required package python3-debian
      ansible.builtin.package:
        name: python3-debian

    # The one-line sources below were written by earlier versions of this role.
    # Remove them so upgrades don't leave duplicate sources. The key file
    # /etc/apt/bareos.gpg is still used by the new sources, so it is kept.
    - name: Remove legacy repository (apt)
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/{{ item.name }}.list"
        state: absent
      no_log: true
      loop: "{{ bareos_repository_list }}"
      loop_control:
        label: "{{ item.name }}"

    # deb_repo is a one-line "deb [options] URI SUITE [COMPONENT...]" string,
    # split here into the parts deb822_repository needs.
    # The noqa is there because ansible-lint can't validate the templated types.
    - name: Add repository (apt)  # noqa: args[module]
      ansible.builtin.deb822_repository:
        name: "{{ item.name }}"
        types: "{{ _bareos_repository_deb_types }}"
        uris: "{{ _bareos_repository_deb_rest[0] }}"
        suites: "{{ _bareos_repository_deb_rest[1] }}"
        components: "{{ _bareos_repository_deb_rest[2:] | default(omit, true) }}"
        architectures: "{{ _bareos_repository_deb_arch | default(omit, true) }}"
        signed_by: "{{ _bareos_repository_deb_signed_by }}"
        state: present
      vars:
        _bareos_repository_deb_line: "{{ item.deb_repo | trim }}"
        _bareos_repository_deb_types: "{{ _bareos_repository_deb_line | regex_search('^deb-src|^deb') }}"
        _bareos_repository_deb_options: "{{ _bareos_repository_deb_line | regex_search('\\[[^\\]]*\\]') | default('', true) }}"
        _bareos_repository_deb_arch_option: "{{ _bareos_repository_deb_options | regex_search('arch=([^\\s\\]]+)', '\\1') | default([''], true) | first }}"
        _bareos_repository_deb_arch: "{{ _bareos_repository_deb_arch_option | split(',') | reject('equalto', '') | list }}"
        # Items without a signed-by option use the key file downloaded above.
        _bareos_repository_deb_signed_by: "{{ _bareos_repository_deb_options | regex_search('signed-by=([^\\s\\]]+)', '\\1') | default(['/etc/apt/bareos.gpg'], true) | first }}"
        _bareos_repository_deb_rest: "{{ _bareos_repository_deb_line | regex_replace('^\\S+\\s+(\\[[^\\]]*\\]\\s+)?', '') | split() }}"
      register: bareos_repository_deb822_repository
      no_log: true
      loop: "{{ bareos_repository_list }}"
      loop_control:
        label: "{{ item.name }}"

    # deb822_repository does not refresh the package cache, apt_repository did.
    - name: Update apt cache (apt)  # noqa: no-handler
      ansible.builtin.apt:
        update_cache: true
      when:
        - bareos_repository_deb822_repository is changed

- name: Run tasks on zypper based distributions
  when:
    - ansible_facts['pkg_mgr'] in [ "zypper" ]
  block:
    - name: Download gpg key (zypper)
      ansible.builtin.get_url:
        url: "{{ bareos_repository_gpg_key }}"
        dest: /etc/gnupg/bareos.gpg
        username: "{{ bareos_repository_username }}"
        password: "{{ bareos_repository_password }}"
        owner: root
        group: root
        mode: "0644"
      no_log: true

    - name: Import gpg key (zypper)
      ansible.builtin.rpm_key:
        key: /etc/gnupg/bareos.gpg

    - name: Place credentials file (zypper)
      ansible.builtin.copy:
        content: |
          username={{ bareos_repository_username }}
          password={{ bareos_repository_password }}
        dest: /etc/zypp/credentials.d/bareos
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when:
        - bareos_repository_type == "subscription"

    - name: Add repository (zypper)
      community.general.zypper_repository:
        name: "{{ item.name }}"
        repo: "{{ item.repo }}"
        state: present
      loop: "{{ bareos_repository_list }}"
      loop_control:
        label: "{{ item.name }}"

- name: Enable tracebacks
  when:
    - bareos_repository_enable_tracebacks
  block:
    - name: Add debuginfo repository (rpm)
      ansible.builtin.yum_repository:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        baseurl: "{{ item.baseurl }}"
        gpgcheck: true
        gpgkey: "{{ item.gpgkey }}"
        username: "{{ item.username | default(omit) }}"
        password: "{{ item.password | default(omit) }}"
      no_log: true
      loop: "{{ bareos_repository_debug_list }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - ansible_facts['pkg_mgr'] in [ "dnf", "dnf5", "yum" ]

    - name: Add repository (zypper)
      community.general.zypper_repository:
        name: "{{ item.name }}"
        repo: "{{ item.repo }}"
        state: present
      loop: "{{ bareos_repository_debug_list }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - ansible_facts['pkg_mgr'] in [ "zypper" ]

    - name: Install required packages
      ansible.builtin.package:
        name: "{{ bareos_repository_debug_required_packages }}"

    - name: Check if ptrace_scope sysctl is available
      ansible.builtin.stat:
        path: /proc/sys/kernel/yama/ptrace_scope
      register: bareos_repository_ptrace_scope_stat

    - name: Disable ptrace_scope
      ansible.posix.sysctl:
        name: kernel.yama.ptrace_scope
        value: "0"
        sysctl_set: true
      when: bareos_repository_ptrace_scope_stat.stat.exists
