---
- name: setup | Install dependencies
  ansible.builtin.package:
    name: "{{ influxdb_dependencies }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: setup | Install python3-dnf
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items:
    - wget
    - tar
  when: ansible_facts['os_family'] == 'RedHat'

- name: setup | Add InfluxData's key
  ansible.builtin.get_url:
    url: "{{ influxdb_signing_key }}"
    dest: /etc/apt/trusted.gpg.d/influxdb.asc
    mode: "0644"
  when: ansible_facts['os_family'] == 'Debian'

- name: setup | Install python3-debian
  ansible.builtin.package:
    name: python3-debian
    state: present
  when: ansible_facts['os_family'] == 'Debian'

# The one-line sources below were written by earlier versions of this role.
# Remove them so upgrades don't leave duplicate sources. The key above stays,
# influxdb_repositories refer to it with signed-by.
- name: setup | Remove legacy InfluxData APT sources
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ _influxdb_repo_legacy_file }}.list"
    state: absent
  vars:
    # apt_repository named its file after the URI without scheme, credentials and options.
    _influxdb_repo_parts: "{{ (item | regex_replace('^\\s*deb(?:-src)?\\s+(?:\\[[^\\]]*\\]\\s*)?', '')).split() }}"
    _influxdb_repo_legacy_file: "{{ (_influxdb_repo_parts[0] | regex_replace('^\\w+://', '') | regex_replace('^[^/]*@', '') | regex_replace('[^a-zA-Z0-9]+', ' ')).split() | join('_') }}"
  loop: "{{ influxdb_repositories }}"
  when: ansible_facts['os_family'] == 'Debian'

# Every item of influxdb_repositories is a one-line "deb [options] URI SUITE COMPONENT..."
# string, split it into the parts deb822_repository needs. The package install
# below refreshes the apt cache, deb822_repository does not.
# The noqa is there because ansible-lint can't validate the templated types.
- name: setup | Manage InfluxData APT repositories  # noqa: args[module]
  ansible.builtin.deb822_repository:
    name: "{{ _influxdb_repo_name }}"
    types: "{{ _influxdb_repo_type }}"
    uris: "{{ _influxdb_repo_uri }}"
    suites: "{{ _influxdb_repo_suite }}"
    components: "{{ _influxdb_repo_components }}"
    architectures: "{{ _influxdb_repo_arch.split(',') if _influxdb_repo_arch else omit }}"
    signed_by: "{{ _influxdb_repo_signed_by }}"
    state: present
  vars:
    _influxdb_repo_type: "{{ item | regex_replace('^\\s*(deb(?:-src)?)\\s.*$', '\\1') }}"
    _influxdb_repo_options: "{{ item | regex_replace('^\\s*deb(?:-src)?\\s+(?:\\[([^\\]]*)\\])?.*$', '\\1') }}"
    _influxdb_repo_parts: "{{ (item | regex_replace('^\\s*deb(?:-src)?\\s+(?:\\[[^\\]]*\\]\\s*)?', '')).split() }}"
    _influxdb_repo_uri: "{{ _influxdb_repo_parts[0] }}"
    _influxdb_repo_suite: "{{ _influxdb_repo_parts[1] }}"
    _influxdb_repo_components: "{{ _influxdb_repo_parts[2:] }}"
    _influxdb_repo_arch: "{{ _influxdb_repo_options | regex_search('arch=(\\S+)', '\\1') | default([''], true) | first }}"
    # Without signed-by, fall back to the key installed by "Add InfluxData's key".
    _influxdb_repo_signed_by: "{{ _influxdb_repo_options | regex_search('signed-by=(\\S+)', '\\1') | default(['/etc/apt/trusted.gpg.d/influxdb.asc'], true) | first }}"
    _influxdb_repo_host: "{{ _influxdb_repo_uri | regex_replace('^\\w+://(?:[^/@]*@)?([^/:]+).*$', '\\1') }}"
    _influxdb_repo_name: "{{ (_influxdb_repo_host ~ '_' ~ _influxdb_repo_suite ~ ('_src' if _influxdb_repo_type == 'deb-src' else '')) | regex_replace('[^A-Za-z0-9_-]+', '_') }}"
  loop: "{{ influxdb_repositories }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: setup | Manage InfluxData Yum repositories
  # InfluxData now publishes one universal repo for every RPM distro
  # (their own docs use this same path regardless of distro/release) -
  # the old per-$releasever path (.../rhel/$releasever/...) doesn't
  # exist for Fedora's release numbers and has no packages there.
  ansible.builtin.yum_repository:
    name: influxdb
    description: InfluxDB Repository
    baseurl: https://repos.influxdata.com/stable/$basearch/main
    enabled: true
    gpgcheck: true
    gpgkey: https://repos.influxdata.com/influxdata-archive.key
  when: ansible_facts['os_family'] == 'RedHat'

- name: setup | Ensure InfluxDB packages are installed | Apt
  ansible.builtin.apt:
    name: "{{ item }}"
    state: "{{ influxdb_package_state }}"
    update_cache: true
  loop: "{{ influxdb_packages }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: setup | Ensure InfluxDB packages are installed | Yum
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: "{{ influxdb_package_state }}"
    update_cache: true
  loop: "{{ influxdb_packages }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: setup | Setup InfluxDB default file
  ansible.builtin.template:
    dest: /etc/default/influxdb2
    group: root
    mode: "0644"
    owner: root
    src: etc/default/influxdb2.j2
  notify: Restart InfluxDB

- name: setup | Create influxdb system group
  ansible.builtin.group:
    name: influxdb
    system: true
    state: present

- name: setup | Create influxdb system user
  ansible.builtin.user:
    name: influxdb
    system: true
    shell: "/usr/sbin/nologin"
    group: influxdb
    # createhome: false
    # home: "{{ prometheus_db_dir }}"

- name: setup | Ensure InfluxDB directories exist
  ansible.builtin.file:
    group: influxdb
    mode: "0750"
    owner: influxdb
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ influxdb_config_path }}"
    - "{{ influxdb_bolt_path | dirname }}"
    - "{{ influxdb_engine_path }}"

- name: setup | Remove any previous InfluxDB configuration file
  ansible.builtin.file:
    path: "{{ influxdb_config_path }}/{{ item }}"
    state: absent
  loop:
    - config.json
    - config.toml
  notify: Restart InfluxDB

- name: setup | Setup InfluxDB configuration file
  ansible.builtin.template:
    dest: "{{ influxdb_config_path }}/config.yml"
    group: influxdb
    mode: "0644"
    owner: influxdb
    src: etc/influxdb/config.yml.j2
  notify: Restart InfluxDB

- name: setup | Ensure InfluxDB service is in the desired state
  ansible.builtin.service:
    enabled: "{{ influxdb_service_enabled }}"
    name: "{{ influxdb_service_name }}"
    state: "{{ influxdb_service_state }}"
