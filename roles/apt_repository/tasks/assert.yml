---
- name: assert | Test apt_repositories
  ansible.builtin.assert:
    that:
      - apt_repositories is iterable
    quiet: true
  when:
    - apt_repositories is defined

- name: assert | Test items in apt_repositories are not in the removed one-line format
  ansible.builtin.assert:
    that:
      - item.repo is not defined
      - item.validate_certs is not defined
    fail_msg: >-
      apt_repositories items no longer take `repo` or `validate_certs`. Convert the item to
      `name`, `uris`, `suites`, `components` and `signed_by`, see defaults/main.yml.
    quiet: true
  loop: "{{ apt_repositories }}"
  loop_control:
    label: "{{ item.name | default(item.repo | default('unnamed')) }}"
  when:
    - apt_repositories is defined

- name: assert | Test mandatory item.name in apt_repositories
  ansible.builtin.assert:
    that:
      - item.name is string
    quiet: true
  loop: "{{ apt_repositories }}"
  loop_control:
    label: "{{ item.name | default(item.repo | default('unnamed')) }}"
  when:
    - apt_repositories is defined

- name: assert | Test optional item.state in apt_repositories
  ansible.builtin.assert:
    that:
      - item.state is string
      - item.state in [ "absent", "present" ]
    quiet: true
  loop: "{{ apt_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - apt_repositories is defined
    - item.state is defined

- name: assert | Test item.uris and item.suites in apt_repositories to be present
  ansible.builtin.assert:
    that:
      - item.uris is defined
      - item.suites is defined
    quiet: true
  loop: "{{ apt_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - apt_repositories is defined
    - item.state | default('present') == "present"
