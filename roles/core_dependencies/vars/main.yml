---
# vars file for core_dependencies

core_dependencies_conflicting_packages:
  - busybox-xz

core_dependencies_shared_packages:
  - acl
  - at
  - bzip2
  - bash
  - git
  - gzip
  - tar
  - unzip

_core_dependencies_specific_packages:
  Archlinux:
    - iproute2
    - shadow
    - subversion
    - xz
  Alpine:
    - iproute2
    - shadow
    - subversion
    - xz
  Amazon-2018:
    - iproute
    - shadow-utils
    - xz
  Amazon-2:
    - iproute
    - shadow-utils
    - xz
  Debian:
    - apt-transport-https
    - debconf
    - debconf-i18n
    - iproute2
    - passwd
    - python3-apt
    - subversion
    - xz-utils
  Fedora-41:
    - dnf
    - iproute
    - python3-libdnf5
    - python3-libselinux
    - python3-libsemanage
    - shadow-utils
    - xz
  RedHat-7:
    - iproute
    - libselinux-python
    - libsemanage-python
    - shadow-utils
    - xz
    - yum
  RedHat:
    - dnf
    - iproute
    - python3-dnf
    - python3-libselinux
    - python3-libsemanage
    - shadow-utils
    - xz
  Suse:
    - iproute2
    - libselinux1
    - python3-selinux
    - shadow
    - subversion
    - xz

core_dependencies_specific_packages: "{{ _core_dependencies_specific_packages[ansible_facts['distribution'] ~ '-' ~ ansible_facts['distribution_major_version']] |
  default(_core_dependencies_specific_packages[ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_core_dependencies_specific_packages[ansible_facts['os_family']]
  )) }}"

core_dependencies_packages: "{{ core_dependencies_shared_packages + core_dependencies_specific_packages }}"
