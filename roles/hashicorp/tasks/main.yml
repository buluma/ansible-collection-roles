---
- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  delegate_to: localhost
  run_once: true
- name: Install using package
  when:
    - hashicorp_installation_method == "package"
  block:
    - name: Install repository for RedHat
      ansible.builtin.get_url:
        dest: /etc/yum.repos.d/hashicorp.repo
        mode: "0640"
        url: "{{ hashicorp_repository_url }}"
      when:
        - ansible_facts['os_family'] in [ "RedHat", "Rocky" ]
    - name: Configure debian
      when:
        - ansible_facts['os_family'] == "Debian"
      block:
        - name: Install required package gpg
          ansible.builtin.package:
            name: gpg
        - name: Install required package python3-debian
          ansible.builtin.package:
            name: python3-debian
        # The key and the one-line source below were written by earlier versions
        # of this role. Remove them so upgrades don't leave duplicate sources.
        - name: Remove legacy apt key for Debian
          ansible.builtin.file:
            path: /etc/apt/trusted.gpg.d/hashicorp.asc
            state: absent
        - name: Remove legacy apt source for Debian
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/apt_releases_hashicorp_com.list
            state: absent
        - name: Install repository for Debian
          ansible.builtin.deb822_repository:
            name: hashicorp
            types: deb
            uris: https://apt.releases.hashicorp.com
            suites: "{{ ansible_facts['distribution_release'] }}"
            components: main
            architectures: "{{ hashicorp_architecture_mapping }}"
            signed_by: https://apt.releases.hashicorp.com/gpg
            state: present
          register: hashicorp_deb822_repository
        # deb822_repository does not refresh the package cache, apt_repository did.
        - name: Update apt cache for Debian  # noqa: no-handler
          ansible.builtin.apt:
            update_cache: true
          when:
            - hashicorp_deb822_repository is changed
    - name: Install hashicorp product using package
      when:
        - hashicorp_products is defined
      block:
        - name: Install latest hashicorp product using package
          ansible.builtin.package:
            name: "{{ item.name }}"
            state: present
          loop: "{{ hashicorp_products }}"
          loop_control:
            label: "{{ item.name }}"
          when:
            - item.version is not defined
        - name: Install versioned hashicorp product using package
          ansible.builtin.package:
            name: "{{ item.name }}{{ version_coupler }}{{ item.version }}"
            state: present
          when:
            - item.version is defined
          loop: "{{ hashicorp_products }}"
          loop_control:
            label: "{{ item.name }}"
- name: Install manually
  when:
    - hashicorp_installation_method == "manual"
  block:
    - name: Install hashicorp product manually
      ansible.builtin.unarchive:
        dest: "{{ hashicorp_destination }}"
        group: "{{ hashicorp_group }}"
        mode: "{{ hashicorp_mode }}"
        owner: "{{ hashicorp_owner }}"
        remote_src: true
        src: "{{ hashicorp_src }}"
      loop: "{{ hashicorp_products }}"
      loop_control:
        label: "{{ item.name }}"
