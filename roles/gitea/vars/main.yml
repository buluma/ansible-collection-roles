---
# vars file for gitea
gitea_go_arch_map:
  i386: "386"
  x86_64: "amd64"
  aarch64: "arm64"
  armv7l: "arm-6"
  armv6l: "arm-6"
  armv5l: "arm-5"

gitea_arch: "{{ gitea_go_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"

_gitea_dependencies:
  Debian:
    - git
    - gnupg2
    - xz-utils
  RedHat:
    - git
    - gnupg2
    - xz
  Suse:
    - git
    - gpg2
    - xz

gitea_dependencies: "{{ _gitea_dependencies[ansible_facts['os_family']] }}"
