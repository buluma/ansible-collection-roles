---
- name: pkg-debian | Install apt-transport-https
  ansible.builtin.apt:
    update_cache: true
    name: apt-transport-https
    state: present
  when: not ansible_check_mode

- name: pkg-debian | Install gnupg
  ansible.builtin.apt:
    update_cache: true
    name: gnupg
    state: present
  when: not ansible_check_mode

- name: pkg-debian | Check if keyring exists with correct mode, keyring={{ datadog_apt_usr_share_keyring }}
  ansible.builtin.stat:
    path: "{{ datadog_apt_usr_share_keyring }}"
  register: agent_apt_keyring_file

- name: pkg-debian | Ensure keyring exists, keyring={{ datadog_apt_usr_share_keyring }}
  ansible.builtin.file:
    path: "{{ datadog_apt_usr_share_keyring }}"
    owner: root
    group: root
    mode: "0644"
    state: touch
  when: not ansible_check_mode and (not agent_apt_keyring_file.stat.exists or not agent_apt_keyring_file.stat.mode == "0644")

- name: pkg-debian | Install apt keys from default URLs
  ansible.builtin.include_tasks: _apt-key-import.yml
  with_items: "{{ datadog_apt_default_keys }}"
  when: datadog_apt_key_url_new is not defined and not ansible_check_mode

- name: pkg-debian | Install apt keys from custom URL
  ansible.builtin.include_tasks: _apt-key-import.yml
  with_items:
    - key: A2923DFF56EDA6E76E55E492D3A80E30382E94DE
      value: "{{ datadog_apt_key_url_new }}"
    - key: D75CEA17048B9ACBF186794B32637D44F14F620E
      value: "{{ datadog_apt_key_url_new }}"
    - key: 5F1E256061D813B125E156E8E6266D4AC0962C7D
      value: "{{ datadog_apt_key_url_new }}"
    - key: D18886567EABAD8B2D2526900D826EB906462314
      value: "{{ datadog_apt_key_url_new }}"
  when: datadog_apt_key_url_new is defined and not ansible_check_mode

- name: pkg-debian | Ensure keyring1 exists with same contents as keyring2 for older distro versions. keyring1,keyring2= {{ datadog_apt_trusted_d_keyring,
    datadog_apt_usr_share_keyring }}
  ansible.builtin.copy:
    src: "{{ datadog_apt_usr_share_keyring }}"
    dest: "{{ datadog_apt_trusted_d_keyring }}"
    mode: "0644"
    remote_src: true
  when: ((ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version']|int < 9) or (ansible_facts['distribution'] == 'Ubuntu' and
    ansible_facts['distribution_major_version'] | int < 16)) and not ansible_check_mode

- name: pkg-debian | Install required package python3-debian
  ansible.builtin.package:
    name: python3-debian
  when: not ansible_check_mode

# The deprecated sources (deb http(s)://apt.datadoghq.com/ stable main|6|7) were written as
# one-line sources by earlier versions of this role, without the filename option. In that case
# apt_repository derives the file name from the URI, so all six end up in apt_datadoghq_com.list.
# apt_repository state=absent removed the matching lines from whichever file held them, while
# deb822_repository state=absent can only remove by name. Remove the legacy file instead, this
# also drops any signed-by line an intermediate version of this role wrote to the same file, the
# deb822 sources below replace it.
- name: pkg-debian | Ensure Datadog non-https repositories and repositories not using signed-by option are deprecated
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/apt_datadoghq_com.list
    state: absent
  register: agent_datadog_deprecated_repo_file
  when: not ansible_check_mode

# The one-line sources below were written by earlier versions of this role. Remove them so
# upgrades don't leave duplicate sources next to the deb822 sources. This is unconditional, the
# deb822 sources below are rewritten when the repository changes, so the old
# compare-and-delete of the custom file is no longer needed.
- name: pkg-debian | Remove legacy Datadog one-line repository files
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ansible_datadog_{{ item }}.list
    state: absent
  register: agent_datadog_legacy_repo_files
  loop:
    - 5
    - 6
    - 7
    - custom
  when: not ansible_check_mode

# datadog_agent{5,6,7}_apt_repo are one-line "deb [options] URI SUITE [COMPONENT...]" strings,
# split here into the parts deb822_repository needs.
# The noqa is there because ansible-lint can't validate the templated types.
- name: pkg-debian | Ensure Datadog repository is up-to-date  # noqa: args[module]
  ansible.builtin.deb822_repository:
    name: ansible_datadog_{{ item.key }}
    types: "{{ _datadog_apt_repo_types }}"
    uris: "{{ _datadog_apt_repo_rest[0] }}"
    suites: "{{ _datadog_apt_repo_rest[1] }}"
    components: "{{ _datadog_apt_repo_rest[2:] | default(omit, true) }}"
    architectures: "{{ _datadog_apt_repo_arch | default(omit, true) }}"
    signed_by: "{{ _datadog_apt_repo_signed_by }}"
    state: "{% if item.key == agent_datadog_agent_major_version | int and datadog_apt_repo | length == 0 %}present{% else %}absent{% endif %}"
  vars:
    _datadog_apt_repo_line: "{{ item.value | trim }}"
    _datadog_apt_repo_types: "{{ _datadog_apt_repo_line | regex_search('^deb-src|^deb') }}"
    _datadog_apt_repo_options: "{{ _datadog_apt_repo_line | regex_search('\\[[^\\]]*\\]') | default('', true) }}"
    _datadog_apt_repo_arch_option: "{{ _datadog_apt_repo_options | regex_search('arch=([^\\s\\]]+)', '\\1') | default([''], true) | first }}"
    _datadog_apt_repo_arch: "{{ _datadog_apt_repo_arch_option | split(',') | reject('equalto', '') | list }}"
    # Without a signed-by option the keyring maintained by this role is used.
    _datadog_apt_repo_signed_by: "{{ _datadog_apt_repo_options | regex_search('signed-by=([^\\s\\]]+)', '\\1') | default([datadog_apt_usr_share_keyring], true) | first }}"
    _datadog_apt_repo_rest: "{{ _datadog_apt_repo_line | regex_replace('^\\S+\\s+(\\[[^\\]]*\\]\\s+)?', '') | split() }}"
  register: agent_datadog_deb822_repositories
  when: (not ansible_check_mode)
  with_dict:
    6: "{{ datadog_agent6_apt_repo }}"
    7: "{{ datadog_agent7_apt_repo }}"

# datadog_apt_repo is a one-line "deb [options] URI SUITE [COMPONENT...]" string, split here
# into the parts deb822_repository needs.
# The noqa is there because ansible-lint can't validate the templated types.
- name: pkg-debian | (Custom) Ensure Datadog repository is up-to-date  # noqa: args[module]
  ansible.builtin.deb822_repository:
    name: ansible_datadog_custom
    types: "{{ _datadog_apt_repo_types }}"
    uris: "{{ _datadog_apt_repo_rest[0] }}"
    suites: "{{ _datadog_apt_repo_rest[1] }}"
    components: "{{ _datadog_apt_repo_rest[2:] | default(omit, true) }}"
    architectures: "{{ _datadog_apt_repo_arch | default(omit, true) }}"
    signed_by: "{{ _datadog_apt_repo_signed_by }}"
    state: present
  vars:
    _datadog_apt_repo_line: "{{ datadog_apt_repo | trim }}"
    _datadog_apt_repo_types: "{{ _datadog_apt_repo_line | regex_search('^deb-src|^deb') }}"
    _datadog_apt_repo_options: "{{ _datadog_apt_repo_line | regex_search('\\[[^\\]]*\\]') | default('', true) }}"
    _datadog_apt_repo_arch_option: "{{ _datadog_apt_repo_options | regex_search('arch=([^\\s\\]]+)', '\\1') | default([''], true) | first }}"
    _datadog_apt_repo_arch: "{{ _datadog_apt_repo_arch_option | split(',') | reject('equalto', '') | list }}"
    # Without a signed-by option the keyring maintained by this role is used.
    _datadog_apt_repo_signed_by: "{{ _datadog_apt_repo_options | regex_search('signed-by=([^\\s\\]]+)', '\\1') | default([datadog_apt_usr_share_keyring], true) | first }}"
    _datadog_apt_repo_rest: "{{ _datadog_apt_repo_line | regex_replace('^\\S+\\s+(\\[[^\\]]*\\]\\s+)?', '') | split() }}"
  register: agent_datadog_custom_deb822_repository
  when: (datadog_apt_repo | length > 0) and (not ansible_check_mode)

- name: pkg-debian | (Custom) Remove Datadog custom repository when not set
  ansible.builtin.deb822_repository:
    name: ansible_datadog_custom
    state: absent
  register: agent_datadog_custom_deb822_repository_removed
  when: (datadog_apt_repo | length == 0) and (not ansible_check_mode)

# deb822_repository does not refresh the package cache, apt_repository did. The install tasks
# below only refresh it when it is older than datadog_apt_cache_valid_time, which is not enough
# after a repository change.
- name: pkg-debian | Update apt cache after repository changes  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when:
    - not ansible_check_mode
    - >-
      agent_datadog_deprecated_repo_file is changed
      or agent_datadog_legacy_repo_files is changed
      or agent_datadog_deb822_repositories is changed
      or agent_datadog_custom_deb822_repository is changed
      or agent_datadog_custom_deb822_repository_removed is changed

- name: pkg-debian | Include debian pinned version install task
  ansible.builtin.include_tasks: pkg-debian/install-pinned.yml
  when: not agent_datadog_skip_install and agent_datadog_agent_debian_version is defined

- name: pkg-debian | Include debian latest version install task
  ansible.builtin.include_tasks: pkg-debian/install-latest.yml
  when: not agent_datadog_skip_install and agent_datadog_agent_debian_version is not defined

- name: pkg-debian | Install latest datadog-signing-keys package
  ansible.builtin.apt:
    name: datadog-signing-keys
    state: latest # noqa package-latest
    # we don't use update_cache: yes, as that was just done by the "Ensure Datadog repository is up-to-date" task above
  register: agent_datadog_signing_keys_install
  when: not ansible_check_mode
