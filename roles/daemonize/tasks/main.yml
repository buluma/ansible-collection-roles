---
# tasks file for daemonize
- name: Update apt cache.
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 600
  when: ansible_facts['os_family'] == 'Debian'
  changed_when: false

- name: Install daemonize packages
  ansible.builtin.package:
    name: "{{ daemonize_packages }}"
    state: present

# pretasks
