---
# vars file for npm

_npm_validate_certs:
  default: true
  Debian: false

npm_validate_certs: "{{ _npm_validate_certs[ansible_facts['os_family']] | default(_npm_validate_certs['default']) }}"

_npm_packages:
  default:
    - npm
  Debian:
    - nodejs

npm_packages: "{{ _npm_packages[ansible_facts['os_family']] | default(_npm_packages['default']) }}"

npm_gpg_key: "https://rpm.nodesource.com/pub/el/NODESOURCE-GPG-SIGNING-KEY-EL"

npm_yum_repositories:
  - name: nodejs
    baseurl: "https://rpm.nodesource.com/pub_24.x/nodistro/nodejs/$basearch"
    description: Node.js Packages

npm_apt_key: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"

npm_apt_repositories:
  - "deb https://deb.nodesource.com/node_24.x nodistro main"
  - "deb-src https://deb.nodesource.com/node_24.x nodistro main"

# The npm_registry is set in `defaults/main.yml`, bases on this mapping.
_npm_registry:
  default: "https://registry.npmjs.org/"
  Amazon: "http://registry.npmjs.org/"
