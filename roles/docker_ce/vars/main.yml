---
_docker_ce_arch:
  aarch64: arm64
  armv7l: armhf
  default: amd64
  ppc64le: ppc64le
  s390x: s390x
  x86_64: amd64
_docker_ce_dist:
  AlmaLinux: centos
  OracleLinux: centos
  RedHat: rhel
  Rocky: centos
  default: "{{ ansible_facts['distribution'] | lower }}"
_docker_ce_requirements:
  RedHat-7:
    - iptables
  default: []
docker_ce_apt_key_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
docker_ce_apt_repository_arch: "{{ _docker_ce_arch[ansible_facts['architecture']] | default(_docker_ce_arch['default']) }}"
docker_ce_apt_repository_repo: "deb [arch={{ docker_ce_apt_repository_arch }}] https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }} stable"
docker_ce_dist: "{{ _docker_ce_dist[ansible_facts['distribution']] | default(_docker_ce_dist['default']) }}"
docker_ce_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
docker_ce_requirements: "{{ _docker_ce_requirements[ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']] | default(_docker_ce_requirements['default']
  ) }}"
docker_ce_service: docker
docker_ce_yum_repositories: "https://download.docker.com/linux/{{ docker_ce_dist }}/docker-ce.repo"
