---
# tasks file for virtualbox

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Import rpm key
  ansible.builtin.rpm_key:
    state: present
    key: "{{ item }}"
  loop: "{{ virtualbox_keys }}"
  loop_control:
    label: "{{ item | basename }}"
  when:
    - ansible_facts['pkg_mgr'] in [ "yum", "dnf", "dnf5", "zypper" ]

- name: Place yum repository
  ansible.builtin.yum_repository:
    name: virtualbox
    description: Fedora $releasever - $basearch - VirtualBox
    baseurl: "{{ virtualbox_yum_baseurl }}"
    gpgcheck: true
  when:
    - ansible_facts['pkg_mgr'] in [ "yum", "dnf", "dnf5" ]

- name: Place zypper repository
  community.general.zypper_repository:
    name: virtualbox
    repo: "{{ virtualbox_yum_baseurl }}"
    state: present
  when:
    - ansible_facts['pkg_mgr'] in [ "zypper" ]

- name: Configure apt repository
  when:
    - ansible_facts['pkg_mgr'] in [ "apt" ]
  block:
    - name: Ensure python3-debian is installed for deb822_repository.
      ansible.builtin.package:
        name: python3-debian
        state: present

    # The keys and the one-line source below were written by earlier versions
    # of this role. Remove them so upgrades don't leave duplicate sources.
    - name: Remove legacy apt key
      ansible.builtin.file:
        path: "/etc/apt/trusted.gpg.d/virtualbox-{{ item | basename | regex_replace('\\.asc$', '') }}.gpg"
        state: absent
      loop: "{{ virtualbox_keys }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Remove legacy apt source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/download_virtualbox_org_virtualbox_debian.list
        state: absent

    # deb822_repository fetches the key itself, but signed_by takes a single
    # key, so only the first entry of virtualbox_keys is used.
    - name: Place apt repository
      ansible.builtin.deb822_repository:
        name: virtualbox
        types: deb
        uris: "{{ virtualbox_apt_repository }}"
        suites: "{{ ansible_facts['distribution_release'] | lower }}"
        components: contrib
        architectures: amd64
        signed_by: "{{ virtualbox_keys | first }}"
        state: present
      register: virtualbox_deb822_repository

    # deb822_repository does not refresh the package cache, apt_repository did.
    - name: Update apt cache  # noqa: no-handler
      ansible.builtin.apt:
        update_cache: true
      when:
        - virtualbox_deb822_repository is changed

- name: Install requirements
  ansible.builtin.package:
    name: "{{ virtualbox_requirements }}"
    state: present

- name: Install virtualbox
  ansible.builtin.package:
    name: "{{ virtualbox_package }}"
    state: present
  notify:
    - Run vboxconfig
