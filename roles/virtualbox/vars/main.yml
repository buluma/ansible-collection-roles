---
# vars file for virtualbox

# The pre-2016 oracle_vbox.asc key fails import under RHEL9/10's stricter
# gpg policy ("No binding signature") - the 2016 key alone has covered every
# supported release since VirtualBox 6.1.44/7.0.8.
virtualbox_keys:
  - https://www.virtualbox.org/download/oracle_vbox_2016.asc

# Fingerprint of oracle_vbox_2016.asc, as published by Oracle on
# https://www.virtualbox.org/wiki/Linux_Downloads. Every key in virtualbox_keys
# is verified against it before it is trusted.
virtualbox_key_fingerprint: B9F8D658297AF3EFC18D5CDFA2F683C52980AECF

_virtualbox_requirements:
  default:
    - kernel-devel
  Debian: []
virtualbox_requirements: "{{ _virtualbox_requirements[ansible_facts['os_family']] | default(_virtualbox_requirements['default']) }}"

_virtualbox_repo_mapping:
  Fedora: fedora
  RedHat: el
  Suse: opensuse

virtualbox_repo_mapping: "{{ _virtualbox_repo_mapping[ansible_facts['distribution']] | default(_virtualbox_repo_mapping[ansible_facts['os_family']]) }}"

virtualbox_yum_baseurl: "https://download.virtualbox.org/virtualbox/rpm/{{ virtualbox_repo_mapping }}/$releasever/$basearch"

virtualbox_apt_repository: "https://download.virtualbox.org/virtualbox/debian"

_virtualbox_package:
  default: VirtualBox-{{ virtualbox_version }}
  Debian: virtualbox-{{ virtualbox_version }}

virtualbox_package: "{{ _virtualbox_package[ansible_facts['os_family']] | default(_virtualbox_package['default']) }}"
