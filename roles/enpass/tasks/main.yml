---
# tasks file for enpass

- name: Install required software
  ansible.builtin.package:
    name: "{{ enpass_requirements }}"

- name: Configure Debian like systems
  when:
    - ansible_facts['os_family'] == "Debian"
  block:
    - name: Install required package python3-debian
      ansible.builtin.package:
        name: python3-debian

    # The one-line source below was written by earlier versions of this role.
    # Remove it so upgrades don't leave duplicate sources.
    - name: Remove legacy APT source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/apt_enpass_io.list
        state: absent

    - name: Add APT repository
      ansible.builtin.deb822_repository:
        name: enpass
        types: deb
        uris: https://apt.enpass.io/
        suites: stable
        components: main
        signed_by: https://apt.enpass.io/keys/enpass-linux.key
        state: present
      register: enpass_deb822_repository

    # deb822_repository does not refresh the package cache, apt_repository did.
    - name: Update APT cache  # noqa: no-handler
      ansible.builtin.apt:
        update_cache: true
      when:
        - enpass_deb822_repository is changed

- name: Configure RedHat like systems
  when:
    - ansible_facts['os_family'] == "RedHat"
  block:
    - name: Add YUM repository
      ansible.builtin.yum_repository:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        baseurl: "{{ item.baseurl }}"
        gpgcheck: "{{ item.gpgcheck }}"
        gpgkey: "{{ item.gpgkey }}"
        enabled: "{{ item.enabled | default('true') }}"
      loop: "{{ enpass_yum_repositories }}"
      loop_control:
        label: "{{ item.name }}"

- name: Configure Suse like systems
  when:
    - ansible_facts['os_family'] == "Suse"
  block:
    - name: Add ZYPPER repository
      community.general.zypper_repository:
        name: "{{ item.name }}"
        repo: "{{ item.baseurl }}"
      loop: "{{ enpass_yum_repositories }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name != "enpass-testing"

- name: Trust YUM key
  ansible.builtin.rpm_key:
    key: "https://yum.enpass.io/RPM-GPG-KEY-enpass-signing-key"
  when:
    - ansible_facts['os_family'] == "RedHat"

- name: Install enpass
  ansible.builtin.package:
    name: enpass

# The enpass package downloads its key into /etc/apt/trusted.gpg.d in its postinst on
# every install and upgrade, which makes apt trust it for all repositories. Trust comes
# from signed_by in the repository above, so remove the key after the package is installed.
# This only changes on the run that installs or upgrades the package.
- name: Remove globally trusted APT key installed by the package
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/enpass.asc
    state: absent
  when:
    - ansible_facts['os_family'] == "Debian"
