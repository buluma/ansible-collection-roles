---
# tasks file for python_pip
- name: Find EXTERNALLY-MANAGED files
  ansible.builtin.find:
    paths:
      - /usr/lib
      - /usr/local/lib
    patterns:
      - "EXTERNALLY-MANAGED"
    recurse: true
    file_type: file
  register: externally_managed_files

- name: Rename EXTERNALLY-MANAGED files if they exist
  ansible.builtin.command:
    cmd: "mv {{ item.path }} {{ item.path }}.old"
  loop: "{{ externally_managed_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: externally_managed_files.matched > 0
  args:
    creates: "{{ item.path }}.old"

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Install python pip
  ansible.builtin.package:
    name: "{{ python_pip_packages }}"
    state: present

- name: Configure pip proxy
  community.general.ini_file:
    path: /etc/pip.conf
    section: global
    option: index-url
    value: "{{ python_pip_proxy }}"
    mode: "0644"
  when:
    - python_pip_proxy is defined

- name: Trust hosts
  community.general.ini_file:
    path: /etc/pip.conf
    section: global
    option: trusted-host
    value: "{{ python_pip_trusted_host }}"
    mode: "0644"
  when:
    - python_pip_trusted_host is defined

- name: Update pip.
  ansible.builtin.pip:
    name: "{{ python_pip_pip_package }}"
    state: "{{ python_pip_pip_state }}" # noqa package-latest
    executable: "{{ python_pip_executable | default(omit) }}"
  when:
    - python_pip_update
    - ansible_facts['distribution_release'] | default('') not in [ "bookworm", "noble", "trixie", "forky", "resolute" ]
    - ansible_facts['os_family'] | default('') != "Alpine"

- name: Install requested modules
  ansible.builtin.pip:
    name: "{{ item.name }}"
    state: "{{ item.state | default('present') }}"
    version: "{{ item.version | default(omit) }}"
    executable: "{{ python_pip_executable | default(omit) }}"
  loop: "{{ python_pip_modules }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - ansible_facts['distribution_release'] | default('') not in [ "bookworm", "noble", "trixie", "forky", "resolute" ]
    - ansible_facts['os_family'] | default('') != "Alpine"
