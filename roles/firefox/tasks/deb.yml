---
# Based on instructions at https://support.mozilla.org/en-US/kb/install-firefox-linux#w_install-firefox-deb-package-for-debian-based-distributions
- name: deb | Ensure the directory to store APT repository keys exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: deb | Get gpg key
  ansible.builtin.get_url:
    url: "https://packages.mozilla.org/apt/repo-signing-key.gpg"
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    mode: "0644"

- name: deb | Ensure gpg homedir exists
  # Without this, gpg auto-creates ~/.gnupg/pubring.kbx on first use and
  # exits 2 for it (a benign warning printed to stderr), which then trips
  # `set -o pipefail` in the next task despite stdout being correct.
  ansible.builtin.file:
    path: /root/.gnupg
    state: directory
    mode: "0700"

- name: deb | Verify key fingerprint
  ansible.builtin.shell: |
    set -o pipefail
    gpg -n -q --import --import-options import-show /etc/apt/keyrings/packages.mozilla.org.asc | awk '/pub/{getline; gsub(/^ +| +$/,""); print $0}'
  args:
    executable: /bin/bash
  register: gpg
  changed_when: false

- name: deb | Assert signing key
  ansible.builtin.assert:
    that: gpg.stdout == "35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3"
    fail_msg: Mozilla repo signing key fingerprint is not what we expect, cannot safely install firefox

- name: deb | Install required package python3-debian
  ansible.builtin.package:
    name: python3-debian

# The one-line source below was written by earlier versions of this role.
# Remove it so upgrades don't leave duplicate sources.
- name: deb | Remove legacy apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/packages_mozilla_org_apt.list
    state: absent

- name: deb | Add apt repository
  ansible.builtin.deb822_repository:
    name: mozilla
    types: deb
    uris: https://packages.mozilla.org/apt
    suites: mozilla
    components: main
    signed_by: /etc/apt/keyrings/packages.mozilla.org.asc
    state: present
  register: firefox_deb822_repository

# deb822_repository does not refresh the package cache, apt_repository did.
- name: deb | Update apt cache  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when:
    - firefox_deb822_repository is changed

- name: deb | Prioritize mozilla repo
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000
    mode: "0644"

- name: deb | Install firefox
  ansible.builtin.apt:
    name: firefox
