---
# Verifies and installs the signing key at _telegraf_key_url. Used for the
# InfluxData apt and rpm keys and the Open Build Service rpm key. Neither
# apt_key/deb822_repository (they fetch the key themselves) nor rpm_key (it
# accepts a key file that merely contains the fingerprint, also as a subkey or
# next to other keys) can check that a download is exactly the expected key. So
# the key is fetched into a private temporary directory first and is only
# installed when it holds exactly one key and the fingerprint of that key is
# _telegraf_key_fingerprint. Then only that key is exported and installed, not
# the downloaded bytes: gpg here and apt or rpm later could read a crafted file
# differently, and a keyserver answers with different signatures and armor on
# each fetch, which would report a change on every run.
#
# With _telegraf_key_dest the key is written there as an ASCII armored file (apt
# rejects a binary key in a .asc file), keeping the destination of earlier
# installs so they are updated in place. Without it the key is imported into
# the rpm keyring.
- name: install-key | Create temporary directory
  ansible.builtin.tempfile:
    state: directory
    prefix: telegraf-key-
  register: _telegraf_key_dir
  changed_when: false

- name: install-key | Verify and install key
  block:
    - name: install-key | Download key
      ansible.builtin.get_url:
        url: "{{ _telegraf_key_url }}"
        dest: "{{ _telegraf_key_dir.path }}/key"
        mode: "0600"
      changed_when: false
      register: _telegraf_key_download
      until: _telegraf_key_download is succeeded

    - name: install-key | Read key fingerprints
      ansible.builtin.command:
        argv:
          - gpg
          - --show-keys
          - --with-colons
          - --with-fingerprint
          - "{{ _telegraf_key_dir.path }}/key"
      environment:
        GNUPGHOME: "{{ _telegraf_key_dir.path }}"
      changed_when: false
      register: _telegraf_key_info

    # In the colon listing the first fpr line is the fingerprint of the
    # primary key, the ones after it belong to subkeys.
    - name: install-key | Verify key fingerprint
      ansible.builtin.assert:
        that:
          - _telegraf_key_info.stdout_lines | select('match', '^(pub|sec):') | list | length == 1
          - (_telegraf_key_info.stdout_lines | select('match', '^fpr:') | first).split(':')[9] | upper == _telegraf_key_fingerprint | upper
        fail_msg: >-
          The key downloaded from {{ _telegraf_key_url }} is not a single key
          with fingerprint {{ _telegraf_key_fingerprint }}, refusing to trust it.
        quiet: true

    - name: install-key | Import the verified key into a temporary keyring
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --import
          - "{{ _telegraf_key_dir.path }}/key"
      environment:
        GNUPGHOME: "{{ _telegraf_key_dir.path }}"
      changed_when: false

    # export-minimal keeps the valid subkeys and their binding signatures, which
    # the InfluxData key needs: it has an expired and a current signing subkey.
    - name: install-key | Export only the verified key
      ansible.builtin.command:
        argv:
          - gpg
          - --batch
          - --export
          - --armor
          - --export-options
          - export-minimal
          - --output
          - "{{ _telegraf_key_dir.path }}/verified.asc"
          - "{{ _telegraf_key_fingerprint }}"
      environment:
        GNUPGHOME: "{{ _telegraf_key_dir.path }}"
      changed_when: false

    # Fails when gpg could not use part of the key, so that the export is not
    # the single key that was checked.
    - name: install-key | Read exported key fingerprints
      ansible.builtin.command:
        argv:
          - gpg
          - --show-keys
          - --with-colons
          - --with-fingerprint
          - "{{ _telegraf_key_dir.path }}/verified.asc"
      environment:
        GNUPGHOME: "{{ _telegraf_key_dir.path }}"
      changed_when: false
      register: _telegraf_key_export_info

    - name: install-key | Verify exported key fingerprint
      ansible.builtin.assert:
        that:
          - _telegraf_key_export_info.stdout_lines | select('match', '^(pub|sec):') | list | length == 1
          - (_telegraf_key_export_info.stdout_lines | select('match', '^fpr:') | first).split(':')[9] | upper == _telegraf_key_fingerprint | upper
        fail_msg: >-
          The key exported from {{ _telegraf_key_url }} is not a single key
          with fingerprint {{ _telegraf_key_fingerprint }}, refusing to install it.
        quiet: true

    - name: install-key | Install key
      ansible.builtin.copy:
        src: "{{ _telegraf_key_dir.path }}/verified.asc"
        dest: "{{ _telegraf_key_dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      become: true
      when: _telegraf_key_dest is defined

    - name: install-key | Import key into the rpm keyring
      ansible.builtin.rpm_key:
        key: "{{ _telegraf_key_dir.path }}/verified.asc"
        fingerprint: "{{ _telegraf_key_fingerprint }}"
        state: present
      become: true
      when: _telegraf_key_dest is not defined
  always:
    - name: install-key | Stop the gpg-agent started by the key import
      ansible.builtin.command:
        argv:
          - gpgconf
          - --homedir
          - "{{ _telegraf_key_dir.path }}"
          - --kill
          - gpg-agent
      changed_when: false
      failed_when: false
      when: _telegraf_key_dir.path is defined

    - name: install-key | Remove temporary directory
      ansible.builtin.file:
        path: "{{ _telegraf_key_dir.path }}"
        state: absent
      changed_when: false
