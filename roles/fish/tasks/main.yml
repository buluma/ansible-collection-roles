---
- name: Print base msg
  ansible.builtin.debug:
    msg: >-
      Testing with Ansible {{ ansible_version.full }} using Python {{ ansible_facts['python_version']
      }}
      on {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version']
      }}

- name: Wait for systemd # noqa command-instead-of-module
  ansible.builtin.command: systemctl is-system-running
  register: systemd_status
  until: systemd_status.stdout is search('running|degraded')
  retries: 30
  when: ansible_facts['service_mgr'] == 'systemd'
  changed_when: false
  failed_when: systemd_status.rc > 1

- name: Ensure fish version is valid
  ansible.builtin.assert:
    that:
      - fish_release_version in _fish_valid_versions
    fail_msg: Invalid fish_release_version '{{ fish_release_version }}'. Valid versions are {{ _fish_valid_versions | join(', ') }}.

# The opensuse repository for release 4 has no EL builds. Fail here, before any
# repository is configured, instead of with a 404 or an undefined variable later.
- name: Ensure fish release is available on this platform
  ansible.builtin.assert:
    that:
      - not (fish_release_version is version('4', '>=')
        and ansible_facts['os_family'] == 'RedHat'
        and ansible_facts['distribution'] != 'Fedora')
    fail_msg: >-
      fish release {{ fish_release_version }} has no packages for
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }} (EL).
      Set fish_release_version: 3 for this host.
  tags:
    - fish

- name: Include distribution specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['os_family'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - vars
  tags:
    - fish

- name: Include OS tasks
  ansible.builtin.include_tasks: "install-{{ ansible_facts['os_family'] }}.yml"
  tags:
    - fish
