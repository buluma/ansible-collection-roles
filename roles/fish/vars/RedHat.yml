---
# Fingerprint of the shells:fish OBS project key, the same for every release and
# platform. It matches the fingerprint the OBS API publishes at
# https://api.opensuse.org/public/source/shells:fish/_keyinfo
_fish_rpm_key_id: "24A63B31CAB41B33EC48801E2CE2AC08D880C8E4"
_fish_rpm_key_file: "/etc/pki/rpm-gpg/RPM-GPG-KEY-shells_fish_release_{{ fish_release_version }}"
_fish_repo_version_string: "{{ _fish_repo_strings['version_' ~ fish_release_version][ansible_facts['distribution']][ansible_facts['distribution_major_version'] |
  int] }}"

_fish_repo_strings:
  version_2:
    RedHat:
      5: RedHat_RHEL-{{ ansible_facts['distribution_major_version'] }}
      6: RedHat_RHEL-{{ ansible_facts['distribution_major_version'] }}
      7: RHEL_{{ ansible_facts['distribution_major_version'] }}

    CentOS:
      6: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"
      7: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"

    Fedora:
      26: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"
      27: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"

  version_3:
    RedHat:
      6: RedHat_RHEL-{{ ansible_facts['distribution_major_version'] }}
      7: RHEL_{{ ansible_facts['distribution_major_version'] }}
      8: CentOS_{{ ansible_facts['distribution_major_version'] }}
      9: CentOS-9_Stream

    CentOS:
      6: RedHat_RHEL-{{ ansible_facts['distribution_major_version'] }}
      7: RHEL_{{ ansible_facts['distribution_major_version'] }}
      8: CentOS_{{ ansible_facts['distribution_major_version'] }}
      9: CentOS-9_Stream

    Rocky:
      8: CentOS_{{ ansible_facts['distribution_major_version'] }}
      9: CentOS-9_Stream

    AlmaLinux:
      8: CentOS_{{ ansible_facts['distribution_major_version'] }}
      9: CentOS-9_Stream

    Fedora:
      28: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"
      29: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"
      30: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"
      31: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"
      32: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"

  # Release 4 has no EL builds, main.yml fails early for EL hosts.
  version_4:
    Fedora:
      42: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"
      43: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"
      44: "{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}"
