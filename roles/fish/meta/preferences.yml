---
# Pins the CI platform/version matrix for this role. Without this, ansible-generator
# falls back to default_platforms and silently discards these choices on regenerate.
platforms:
  # EL (RHEL, CentOS, Rocky, AlmaLinux) is left out on purpose: fish 4, the default
  # fish_release_version, has no EL packages in the opensuse repository (EL 9 and 10
  # return 404). EL users have to pin fish_release_version: 3. Add EL back when
  # upstream publishes fish 4 for it, or run a separate job that pins release 3.
  - name: Debian
    versions:
      - all
  - name: Fedora
    versions:
      # Excludes 45: it ships Python 3.15.0b3, whose dataclasses module
      # dropped _is_type, breaking ansible-core's AnsiballZ module wrapper.
      - "44"
      - "43"
  - name: Ubuntu
    versions:
      - all
