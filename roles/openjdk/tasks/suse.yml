---
- name: suse | Install required package gpg2
  vars:
    ansible_python_interpreter: python3
  ansible.builtin.package:
    name: gpg2

# A key is checked against its listed fingerprint before it is imported, see rpm-key.yml.
- name: suse | Verify and import Rpm keys
  ansible.builtin.include_tasks: rpm-key.yml
  vars:
    ansible_python_interpreter: python3
  loop: "{{ _rpm_key[openjdk_release] }}"
  loop_control:
    loop_var: _openjdk_rpm_key
    label: "{{ _openjdk_rpm_key.key }}"
  when: _openjdk_rpm_key.state == 'present'

- name: suse | Rpm --erase keys
  vars:
    ansible_python_interpreter: python3
  ansible.builtin.rpm_key:
    key: "{{ item.key }}"
    fingerprint: "{{ item.fingerprint }}"
    state: "{{ item.state }}"
  loop: "{{ _rpm_key[openjdk_release] }}"
  when: item.state == 'absent'
  register: result
  until: result is succeeded

- name: suse | Yum-config-manager --add-repo
  ansible.builtin.yum_repository:
    file: "{{ item.file }}"
    name: "{{ item.name }}"
    description: "{{ item.description }}"
    baseurl: "{{ item.baseurl }}"
    enabled: "{{ item.enabled }}"
    priority: "{{ item.priority }}"
    module_hotfixes: "{{ item.module_hotfixes }}"
    gpgcheck: "{{ item.gpgcheck }}"
    gpgkey: "{{ item.gpgkey }}"
    state: "{{ item.state }}"
    reposdir: "{{ item.reposdir | default('/etc/zypp/repos.d') }}"
  loop: "{{ _yum_repository[openjdk_release] }}"

- name: suse | Zypper install
  vars:
    ansible_python_interpreter: python3
  community.general.zypper:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
    force_resolution: true
  loop: "{{ _zypper[openjdk_release] }}"
  when: item.name != 'maven' or openjdk_install_maven
  register: result
  until: result is succeeded
