---

name: Test Collection

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test_build:
    # 2.19 is the declared minimum, "2" is whatever is newest.
    name: test_build (ansible-core ${{ matrix.ansible-core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - "2.19"
          - "2"
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v7
        with:
          # ansible-core 2.19 does not support the newest Python as controller.
          python-version: "3.13"
      - name: install ansible-core
        run: pip install "ansible-core==${{ matrix.ansible-core }}.*"
      # galaxy.yml dependencies are what users actually get installed, so they must cover requirements.yml.
      - name: check galaxy.yml dependencies cover requirements.yml
        run: |
          python - <<'EOF'
          import sys
          import yaml
          deps = set(yaml.safe_load(open("galaxy.yml"))["dependencies"])
          reqs = {c["name"] for c in yaml.safe_load(open("requirements.yml"))["collections"]}
          missing = sorted(reqs - deps)
          if missing:
              sys.exit(f"Missing from galaxy.yml dependencies: {', '.join(missing)}")
          EOF
      - name: build collection
        run: ansible-galaxy collection build
      # Galaxy downloads time out intermittently. A partial install makes the next attempt a no-op, so start clean.
      - name: install collection with dependencies
        run: |
          for attempt in 1 2 3 ; do
            echo "Install attempt ${attempt}"
            ansible-galaxy collection install --timeout 120 buluma-roles-*.tar.gz && exit 0
            rm -rf ~/.ansible/collections/ansible_collections
            sleep 15
          done
          exit 1
      - name: syntax-check every role
        run: |
          {
            echo "---"
            for role in roles/*/ ; do
              short=$(basename "${role}")
              printf -- '- name: %s\n  hosts: all\n  gather_facts: false\n  roles:\n    - buluma.roles.%s\n' "${short}" "${short}"
            done
          } > all_roles.yml
          ansible-playbook -i localhost, all_roles.yml --syntax-check
      # --syntax-check does not load files pulled in with include_tasks, so resolve the modules separately.
      - name: resolve every module the roles use
        run: python .github/scripts/check_modules.py roles

  test_galaxy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: install ansible-core
        run: pip install "ansible-core>=2.19"
      - name: install published collection
        run: ansible-galaxy collection install buluma.roles
